# Nginx reverse-proxy configuration for OWASP Juice Shop
# Lab host: alpine-lab (192.168.188.130)
# Installed path on Alpine: /etc/nginx/http.d/default.conf
#
# This is the sanitized configuration pattern used in the lab. Confirm the
# actual Juice Shop listening port on your host before deploying:
#   netstat -tlnp   or   ss -tlnp
#
# Validate before reloading:
#   nginx -t && nginx -s reload
#   tail -n 50 /var/log/nginx/access.log
#   tail -n 50 /var/log/nginx/error.log

server {
    listen 80;
    server_name _;

    # Dedicated web telemetry for central collection by Wazuh
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    location / {
        # Juice Shop was reached through the reverse proxy. The upstream
        # address/port in your lab may differ - verify it on the Alpine host.
        proxy_pass http://127.0.0.1:3000;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---
# Troubleshooting note:
#   proxy_pass 127.0.0.1:3000;       -> "emerg invalid url prefix"
#   proxy_pass http://127.0.0.1:3000; -> valid (scheme included)
#
# To forward these logs to Wazuh, add matching <localfile> entries to the
# Alpine agent's ossec.conf. See configurations/syslog-config.txt.
